# Configuración común importada por todos los microservicios
# (spring.config.import: classpath:fastorder-common.yml).
# Credenciales y secretos SOLO por variables de entorno (ver .env.example).

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fastorder}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:fastorder}
    password: ${DB_PASSWORD:fastorder}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never


server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}

fastorder:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-that-is-very-long-and-secure-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Cache-Control,Last-Event-ID
    exposed-headers: Authorization
    allow-credentials: false
    max-age-seconds: 3600
