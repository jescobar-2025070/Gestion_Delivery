server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # ==============================
        # AUTH SERVICE
        # ==============================
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # ==============================
        # CATALOG SERVICE
        # ==============================
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/comercios/**

        # ==============================
        # ORDER SERVICE
        # ==============================
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pedidos/**

        # ==============================
        # DELIVERY SERVICE
        # ==============================
        - id: delivery-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/delivery/**
            - Path=/api/v1/deliveries/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO